name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --var APP_VERSION:${{ github.sha }} --var GITHUB_URL:https://github.com/${{ github.repository }} --var DOWNLOAD_URL: --var PUBLIC_BASE_URL:${{ vars.PUBLIC_BASE_URL }} --var MAIL_TESTER_USERNAME:${{ vars.MAIL_TESTER_USERNAME }} --var MAIL_TESTER_INBOX_DOMAIN:${{ vars.MAIL_TESTER_INBOX_DOMAIN }}
