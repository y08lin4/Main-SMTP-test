name: Release Windows clients

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Build Windows clients
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version "${{ github.ref_name }}" -GitHubUrl "https://github.com/${{ github.repository }}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SMTP-Tester-Windows-x64.exe
            dist/SMTP-Tester-Windows-arm64.exe
